function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}function setPage(p){page=p;document.body.classList.toggle('pos-mode',p==='pos');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.querySelector('#crumb').textContent={home:'Início',pos:'Nova venda',history:'Histórico de vendas',reports:'Relatórios',products:'Produtos',settings:'Configurações'}[p];render()}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));function render(){let v=document.querySelector('#view');if(page==='home')v.innerHTML=home();if(page==='pos')v.innerHTML=pos();if(page==='history')v.innerHTML=history();if(page==='reports')v.innerHTML=reports();if(page==='products')v.innerHTML=productPage();if(page==='settings')v.innerHTML=settings();wire()}
function home(){return `<div class="title-row"><div><h1>Bom dia, Mariana ☀</h1><div class="sub">Aqui está o resumo do seu negócio hoje.</div></div><button class="btn primary" onclick="setPage('pos')">＋ &nbsp; Iniciar nova venda</button></div><div class="grid stats"><div class="card"><div class="statlabel">Faturamento de hoje</div><div class="statvalue">R$ 248,00</div><div class="delta">↑ 12% em relação a ontem</div></div><div class="card"><div class="statlabel">Vendas realizadas</div><div class="statvalue">18</div><div class="delta">↑ 3 vendas hoje</div></div><div class="card"><div class="statlabel">Ticket médio</div><div class="statvalue">R$ 13,78</div><div class="delta">Por venda</div></div><div class="card"><div class="statlabel">Dinheiro em caixa</div><div class="statvalue">R$ 96,00</div><div class="delta">6 vendas em dinheiro</div></div></div><div class="grid columns"><section class="card"><div class="section-head"><h2>Vendas recentes</h2><button class="btn quiet" onclick="setPage('history')">Ver histórico →</button></div>${sales.slice(0,4).map(s=>`<div class="payrow"><div><b>${s[0]}</b><div class="muted" style="margin-top:5px">${s[1]}</div></div><div style="text-align:right"><b>${s[2]}</b><div style="margin-top:6px"><span class="badge ${s[3]==='Dinheiro'?'orange':''}">${s[3]}</span></div></div></div>`).join('')}</section><section class="card"><div class="section-head"><h2>Recebimentos de hoje</h2><span class="muted">18 vendas</span></div><div class="quick"><div>💵 Dinheiro<b>R$ 96,00</b></div><div>◈ Pix<b>R$ 82,00</b></div><div>▣ Débito<b>R$ 45,00</b></div><div>▤ Crédito<b>R$ 25,00</b></div></div><div style="margin-top:18px;padding:15px;background:var(--green2);border-radius:11px;color:var(--green)"><b>Seu dia está indo bem!</b><div style="font-size:12px;margin-top:5px">Você já realizou 18 vendas hoje.</div></div></section></div>`}
function pos(){return `<div class="pos-top"><div class="pos-brand"><span class="logo">✳</span> raiz <span class="local-status">• &nbsp;<b>Operação local</b> · pronto para vender</span></div><button class="exit-pos" onclick="setPage('home')">← &nbsp; Sair da venda</button></div><div class="title-row"><div><h1>Nova venda</h1><div class="sub">Toque nos produtos para adicionar ao carrinho.</div></div><span class="open-pill">● Atendimento rápido</span></div><div class="pos"><section><div class="searchrow"><div class="search"><input id="search" placeholder="⌕  Buscar produto pelo nome..."></div></div><div class="chips">${['Todos','Bebidas','Lanches'].map(c=>`<button class="chip ${category===c?'selected':''}" data-cat="${c}">${c}</button>`).join('')}</div><div class="grid products" style="margin-top:15px">${products.filter(p=>(category==='Todos'||p.category===category)&&p.name.toLowerCase().includes((document.querySelector('#search')?.value||'').toLowerCase())).map(p=>`<button class="product" data-add="${p.id}"><span class="emoji">${p.emoji}</span><b>${p.name}</b><small>${p.category}</small><strong>${brl(p.price)}</strong></button>`).join('')}</div></section><aside class="card cart"><div class="carthead"><h2>Carrinho</h2><span class="badge">${cart.reduce((a,b)=>a+b.qty,0)} itens</span></div><div class="cartbody">${cart.length?cart.map(i=>`<div class="cartitem"><div><b>${i.name}</b><small>${brl(i.price)} cada</small><button class="remove" data-remove="${i.id}">Remover</button></div><div class="qty"><button data-dec="${i.id}">−</button><b>${i.qty}</b><button data-inc="${i.id}">+</button></div><div style="grid-column:1/-1;text-align:right;font-weight:700">${brl(i.price*i.qty)}</div></div>`).join(''):`<div class="empty"><span class="emoji">🛍️</span>Seu carrinho está vazio.<br>Adicione produtos para começar.</div>`}</div><div class="cartfoot"><div class="totalrow"><span>Total da venda</span><b>${brl(cart.reduce((a,b)=>a+b.price*b.qty,0))}</b></div><button class="btn primary wide" ${cart.length?'':'disabled style="opacity:.45;cursor:not-allowed"'} onclick="openPayment()">Finalizar venda &nbsp; →</button></div></aside></div>`}
function history(){return `<div class="title-row"><div><h1>Histórico de vendas</h1><div class="sub">Consulte vendas e acesse os comprovantes.</div></div><button class="btn secondary" onclick="toast('Relatório pronto para exportar')">⇩ &nbsp; Exportar</button></div><div class="filters"><input type="date" value="2026-10-07"><select><option>Todas as formas</option><option>Dinheiro</option><option>Pix</option><option>Débito</option><option>Crédito</option></select><input placeholder="⌕ Buscar número da venda"></div><section class="card tablewrap"><table class="table"><thead><tr><th>Venda</th><th>Data</th><th>Horário</th><th>Total</th><th>Pagamento</th><th></th></tr></thead><tbody>${sales.map((s,i)=>`<tr><td><b>${s[0]}</b></td><td>${s[1].split(',')[0]}</td><td>${s[1].split(',')[1]||'—'}</td><td><b>${s[2]}</b></td><td><span class="badge ${s[3]==='Dinheiro'?'orange':''}">${s[3]}</span></td><td><button class="btn quiet" onclick="saleDetail(${i})">Ver detalhes →</button></td></tr>`).join('')}</tbody></table></section><div id="detail" class="card detail" style="margin-top:16px"></div>`}
function reports(){let vals=period==='Semana'?[44,72,58,88,65,100,79]:period==='Hoje'?[28,52,84,64,100,73,88]:[55,66,49,80,72,100,91];return `<div class="title-row"><div><h1>Relatórios</h1><div class="sub">Acompanhe o desempenho das suas vendas.</div></div><div class="tabs">${['Hoje','Semana','Mês'].map(x=>`<button class="${period===x?'active':''}" data-period="${x}">${x}</button>`).join('')}</div></div><div class="grid stats"><div class="card"><div class="statlabel">Faturamento</div><div class="statvalue">${period==='Hoje'?'R$ 248,00':'R$ 1.482,00'}</div></div><div class="card"><div class="statlabel">Vendas</div><div class="statvalue">${period==='Hoje'?'18':'106'}</div></div><div class="card"><div class="statlabel">Ticket médio</div><div class="statvalue">R$ 13,78</div></div><div class="card"><div class="statlabel">Período</div><div class="statvalue" style="font-size:19px">${period==='Hoje'?'07 out':'01—07 out'}</div></div></div><div class="grid columns"><section class="card"><div class="section-head"><h2>${period==='Mês'?'Faturamento por dia':'Vendas por dia'}</h2><span class="muted">${period==='Hoje'?'Hoje':'Últimos 7 dias'}</span></div><div class="bargraph">${vals.map((n,i)=>`<div class="barwrap"><div class="bar ${i===6?'today':''}" style="height:${n}%"></div>${period==='Hoje'?['8h','10h','12h','14h','16h','18h','20h'][i]:['Qui','Sex','Sáb','Dom','Seg','Ter','Qua'][i]}</div>`).join('')}</div></section><section class="card"><div class="section-head"><h2>Por forma de pagamento</h2></div>${[['Dinheiro','R$ 96,00','orange'],['Pix','R$ 82,00',''],['Débito','R$ 45,00','blue'],['Crédito','R$ 25,00','purple']].map(x=>`<div class="payrow"><div class="payleft"><span class="dot ${x[2]}"></span>${x[0]}</div><b>${x[1]}</b></div>`).join('')}</section></div>`}
function productPage(){return `<div class="title-row"><div><h1>Produtos</h1><div class="sub">Gerencie o que aparece no seu PDV.</div></div><button class="btn primary" onclick="productModal()">＋ &nbsp; Novo produto</button></div><div class="filters"><div class="search" style="max-width:340px"><input placeholder="⌕  Buscar produto..."></div><select><option>Todas as categorias</option><option>Bebidas</option><option>Lanches</option></select><select><option>Ativos e inativos</option><option>Ativos</option><option>Inativos</option></select></div><section class="card tablewrap"><table class="table"><thead><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Status</th><th></th></tr></thead><tbody>${products.map(p=>`<tr><td><div class="producttable"><span class="miniemoji">${p.emoji}</span><b>${p.name}</b></div></td><td>${p.category}</td><td><b>${brl(p.price)}</b></td><td><span class="badge">Ativo</span></td><td><button class="btn quiet" onclick="productModal('${p.name}')">Editar</button><button class="btn quiet" onclick="toast('Produto desativado')">Desativar</button></td></tr>`).join('')}</tbody></table></section>`}
function settings(){return `<div class="title-row"><div><h1>Configurações</h1><div class="sub">Personalize as informações do seu negócio.</div></div></div><section class="card" style="max-width:680px"><div class="section-head"><h2>Dados do negócio</h2></div><div class="field"><label>Nome do negócio</label><input value="Raiz — Guaraná da Amazônia"></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Telefone (opcional)</label><input placeholder="(00) 00000-0000"></div><div class="field"><label>Impressora padrão</label><select><option>Selecionar depois</option><option>Térmica 80 mm</option><option>Convencional A4</option></select></div></div><button class="btn primary" onclick="toast('Preferências salvas')">Salvar alterações</button><div style="margin-top:25px;padding:15px;background:#f6f8f6;border-radius:10px;color:var(--muted)">O PDV funciona localmente e não exige conexão com a internet.</div></section>`}
function wire(){document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let p=products.find(x=>x.id==b.dataset.add),i=cart.find(x=>x.id===p.id);i?i.qty++:cart.push({...p,qty:1});render()});document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{cart.find(x=>x.id==b.dataset.inc).qty++;render()});document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{let i=cart.find(x=>x.id==b.dataset.dec);i.qty--;if(i.qty===0)cart=cart.filter(x=>x!==i);render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.id!=b.dataset.remove);render()});document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;render()});const s=document.querySelector('#search');if(s)s.oninput=()=>{let posY=window.scrollY;let area=document.querySelector('.products');area.innerHTML=products.filter(p=>(category==='Todos'||p.category===category)&&p.name.toLowerCase().includes(s.value.toLowerCase())).map(p=>`<button class="product" data-add="${p.id}"><span class="emoji">${p.emoji}</span><b>${p.name}</b><small>${p.category}</small><strong>${brl(p.price)}</strong></button>`).join('');wire()}}
function openPayment(){payment='Dinheiro';received='';paymentModal()}function paymentModal(){let total=cart.reduce((a,b)=>a+b.price*b.qty,0),recv=parseFloat((received||'').replace(',','.'))||0,change=recv-total;document.querySelector('#modalroot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><div><h2>Finalizar venda</h2><div class="sub" style="margin-top:5px">Escolha como o cliente vai pagar.</div></div><button class="x" onclick="closeModal()">×</button></div><div class="modalbody"><div class="paytotal"><span>Total a pagar</span><b>${brl(total)}</b></div><div style="font-weight:700;margin:19px 0 9px">Forma de pagamento</div><div class="paymethods">${['Dinheiro','Pix','Débito','Crédito'].map((x,i)=>`<button class="method ${payment===x?'selected':''}" onclick="payment='${x}';paymentModal()">${['💵','◈','▣','▤'][i]}<br>${x}</button>`).join('')}</div>${payment==='Dinheiro'?`<div class="field"><label>Valor recebido</label><input id="received" inputmode="decimal" placeholder="Ex.: 30,00" value="${received}" oninput="received=this.value;paymentModal();document.querySelector('#received').focus();document.querySelector('#received').setSelectionRange(document.querySelector('#received').value.length,document.querySelector('#received').value.length)"></div><div class="changebox ${recv&&change<0?'error':''}"><span>${recv&&change<0?'Valor insuficiente':recv?'Troco':'Troco a devolver'}</span><b>${recv?brl(Math.max(0,change)):'—'}</b></div>`:''}</div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Voltar</button><button class="btn primary" ${payment==='Dinheiro'&&recv<total?'disabled style="opacity:.45;cursor:not-allowed"':''} onclick="completeSale()">Confirmar venda</button></div></div></div>`}
function closeModal(){document.querySelector('#modalroot').innerHTML=''}function completeSale(){let total=cart.reduce((a,b)=>a+b.price*b.qty,0);if(payment==='Dinheiro'&&(parseFloat((received||'').replace(',','.'))||0)<total)return;let sale={no:saleNo++,total,payment,received,items:cart.map(i=>({...i}))};closeModal();cart=[];document.querySelector('#modalroot').innerHTML=`<div class="overlay"><div class="modal"><div class="success"><div class="successicon">✓</div><h2>Venda realizada com sucesso</h2><div class="sub">Tudo certo! O pagamento foi registrado.</div><div class="saleinfo"><div><small>Número da venda</small><b>#${String(sale.no).padStart(6,'0')}</b></div><div><small>Data e horário</small><b>07/10/2026 • 09:35</b></div><div><small>Total</small><b>${brl(sale.total)}</b></div><div><small>Pagamento</small><b>${sale.payment}</b></div></div><div class="successactions"><button class="btn secondary" onclick="receiptModal(${sale.no},${sale.total},'${sale.payment}','${sale.received}',${JSON.stringify(sale.items).replace(/"/g,'&quot;')})">▤ &nbsp; Imprimir comprovante</button><button class="btn primary" onclick="closeModal();setPage('pos')">＋ Nova venda</button></div><button class="btn quiet" style="margin-top:10px" onclick="closeModal();setPage('home')">Voltar ao início</button></div></div></div>`;toast('Venda confirmada')}
function receiptModal(no,total,pay,rec,items=[]){let ch=(parseFloat((rec||'').replace(',','.'))||0)-total;document.querySelector('#modalroot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><div><h2>Prévia do comprovante</h2><div class="sub" style="margin-top:5px">Layout otimizado para papel térmico.</div></div><button class="x" onclick="closeModal()">×</button></div><div class="modalbody"><div class="receipt"><h3>RAIZ • SEU NEGÓCIO</h3><p>Obrigado pela preferência!</p><hr><div>Venda #${String(no).padStart(6,'0')}</div><div>07/10/2026 — 09:35</div><hr>${items.map(i=>`<div>${i.name}<div class="receiptline"><span>${i.qty} x ${brl(i.price)}</span><span>${brl(i.price*i.qty)}</span></div></div>`).join('')}<hr><div class="receiptline big"><span>TOTAL</span><span>${brl(total)}</span></div><div>Pagamento: ${pay.toUpperCase()}</div>${pay==='Dinheiro'?`<div>Recebido: ${brl(parseFloat((rec||'').replace(',','.'))||total)}</div><div>Troco: ${brl(Math.max(0,ch))}</div>`:''}<div class="thanks">Volte sempre :)</div></div></div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="toast('A impressão será configurada na implementação');closeModal()">Imprimir comprovante</button></div></div></div>`}
function saleDetail(i){let d=document.querySelector('#detail');d.classList.add('open');d.innerHTML=`<div class="section-head"><h2>Detalhes da venda ${sales[i][0]}</h2><button class="btn quiet" onclick="document.querySelector('#detail').classList.remove('open')">Fechar ×</button></div><div class="grid" style="grid-template-columns:repeat(4,1fr)"><div><small class="muted">Data</small><p><b>${sales[i][1]}</b></p></div><div><small class="muted">Total</small><p><b>${sales[i][2]}</b></p></div><div><small class="muted">Pagamento</small><p><b>${sales[i][3]}</b></p></div><div><small class="muted">Itens</small><p><b>2 produtos</b></p></div></div><button class="btn secondary" onclick="toast('Abrindo prévia do comprovante')">▤ Imprimir comprovante</button>`}function productModal(name=''){document.querySelector('#modalroot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:480px"><div class="modalhead"><h2>${name?'Editar produto':'Novo produto'}</h2><button class="x" onclick="closeModal()">×</button></div><div class="modalbody"><div class="field"><label>Nome do produto</label><input value="${name}" placeholder="Ex.: Guaraná da Amazônia"></div><div class="field"><label>Preço</label><input placeholder="R$ 0,00"></div><div class="field"><label>Categoria</label><select><option>Bebidas</option><option>Lanches</option><option>Outra</option></select></div><div class="field"><label>Status</label><select><option>Ativo</option><option>Inativo</option></select></div></div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="closeModal();toast('Produto salvo no protótipo')">Salvar produto</button></div></div></div>`}render();
</script></body></html>
